# On an arm64 host, Google's aapt2 is x86-64-only and the build dies with
# "AAPT2 Daemon startup failed". Use ../tools/build-arm64.sh, which passes:
#   -Pandroid.aapt2FromMavenOverride=<repo>/tools/aapt2-qemu/aapt2
# android.aapt2FromMavenOverride=/absolute/path/to/tools/aapt2-qemu/aapt2
